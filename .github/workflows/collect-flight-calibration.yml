name: Collect flight telemetry calibration sample
on:
  push:
    branches: [feat/flight-telemetry-calibration]
    paths:
      - scripts/collect-flight-calibration.mjs
      - package.json
      - .github/workflows/collect-flight-calibration.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect observed ground-speed and timestamp samples
        run: npm run collect:flight-calibration -- --max-pages=24 --samples-per-route=5