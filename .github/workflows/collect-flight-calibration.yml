name: Collect flight telemetry calibration sample
on:
  push:
    branches: ['**']
    paths:
      - scripts/collect-flight-calibration.mjs
      - scripts/fit-flight-calibration.mjs
      - src/core/flight-telemetry.js
      - src/core/flight-calibration-fit.js
      - package.json
      - .github/workflows/collect-flight-calibration.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flight-telemetry-calibration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect observed ground-speed and timestamp samples across the available archive
        run: npm run collect:flight-calibration -- --max-pages-per-route=120 --samples-per-route=6 --history-days=560
      - name: Fit only when independent route coverage is sufficient
        run: npm run fit:flight-calibration
      - name: Commit reproducible telemetry data and fitted parameters
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/flight-calibration.json data/flight-calibration-summary.json src/core/flight-calibration-parameters.js
          if ! git diff --cached --quiet; then
            git commit -m "Add observed ADS-B flight calibration sample"
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase --autostash "origin/${GITHUB_REF_NAME}"; then
              conflicts=$(git diff --name-only --diff-filter=U)
              for file in $conflicts; do
                case "$file" in
                  data/flight-calibration.json|data/flight-calibration-summary.json|src/core/flight-calibration-parameters.js)
                    # This workflow owns these generated files. Keep the
                    # just-collected snapshot while replaying it onto the newer branch.
                    git checkout --theirs -- "$file"
                    git add -- "$file"
                    ;;
                  *)
                    echo "Unexpected rebase conflict: $file"
                    exit 1
                    ;;
                esac
              done
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "Unresolved non-generated rebase conflicts remain."
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload the collected telemetry dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-calibration-telemetry
          path: |
            data/flight-calibration.json
            data/flight-calibration-summary.json
          if-no-files-found: warn
          retention-days: 30
