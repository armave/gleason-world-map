name: Tests
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run fit:endpoint-distance-calibration -- --require-accepted
      - run: git diff --exit-code -- src/core/endpoint-distance-calibration-parameters.js
      - run: npm run build
      - run: npm test
