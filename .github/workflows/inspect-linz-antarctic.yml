name: Inspect LINZ Antarctic survey observations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linz-antarctic-observation-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify LINZ data-access secret is configured
        env:
          LINZ_LDS_API_KEY: ${{ secrets.LINZ_LDS_API_KEY }}
        run: |
          if [ -z "$LINZ_LDS_API_KEY" ]; then
            echo "::error::Add LINZ_LDS_API_KEY as a repository Actions secret before running this workflow."
            exit 1
          fi
      - name: Inspect Antarctic physical marks and reduced survey observations
        env:
          LINZ_LDS_API_KEY: ${{ secrets.LINZ_LDS_API_KEY }}
          LINZ_REVIEW_OUTPUT: tmp/linz-antarctic-observation-review.json
        run: npm run inspect:linz-antarctic
      - name: Upload LINZ Antarctic observation review report
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linz-antarctic-observation-review
          path: tmp/linz-antarctic-observation-review.json
          if-no-files-found: error
          retention-days: 7
