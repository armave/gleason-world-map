name: Bundle local Census county boundaries
on:
  push:
    branches:
      - fix/vendor-county-boundary-data
permissions:
  contents: write
concurrency:
  group: county-boundary-bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate local Census county polygons
        run: |
          if [ ! -f data/us-counties-boundaries.geojson.gz ]; then
            npm run vendor:county-boundaries
          else
            echo "Local county-boundary bundle already exists."
          fi
      - name: Commit generated county-boundary asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-counties-boundaries.geojson.gz
          if ! git diff --cached --quiet; then
            git commit -m "Add local 2026 Census county boundary bundle"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run full test suite including local county asset validation
        run: npm test
